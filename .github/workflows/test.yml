# .github/workflows/test.yml
name: Python Test

on:
  push:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  pull_request:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # rhosocial-activerecord and rhosocial-activerecord-testsuite dev releases are
  # not published to PyPI; install them from git.
  # Install the migration feature branches of core and testsuite so CI verifies
  # this backend against the refactored suggestion protocol, not a stale release.
  CORE_PKG: "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@feature/activerecord-migration"
  TESTSUITE_PKG: "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-migration"

jobs:
  formal-rules:
    name: Formal rules contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install "$CORE_PKG" "$TESTSUITE_PKG"
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install package
        run: |
          pip install -e . --no-deps

      - name: Formal rules contracts
        # Isolated from the emulator-backed suite: these are pure source and
        # contract assertions and must not depend on any database or scenario.
        run: |
          export PYTHONPATH=src:tests
          python -m pytest tests/rhosocial/activerecord_bigquery_test/feature/rules -q -p no:warnings

  test:
    name: Python ${{ matrix.python-version }}
    needs: formal-rules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The emulator is CPU/disk heavy; too many concurrent matrix jobs make
      # per-file shard tests trip their timeouts on shared runner resources.
      max-parallel: 2
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install "$CORE_PKG" "$TESTSUITE_PKG"
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install package
        run: |
          pip install -e . --no-deps

      - name: Run backend tests
        run: |
          bash tests/run_sharded_tests.sh
        env:
          PYTHONPATH: tests
          BIGQUERY_SCENARIOS_CONFIG_PATH: tests/config/bigquery_scenarios.yaml
          BIGQUERY_ACTIVE_SCENARIOS: bigquery_emulator
          # Fewer shards + fewer concurrent jobs keep emulator DDL fast: the
          # error_handling schema fixture rebuilds tables for every test.
          SHARDS: 2
          FILE_TIMEOUT: 1200
          TEST_TIMEOUT: 300
        timeout-minutes: 45

  # Coverage is collected on a single Python version to keep the emulator
  # cost bounded; the matrix above is the real compatibility gate.
  test-with-coverage:
    name: Python 3.12 with coverage
    needs: formal-rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install "$CORE_PKG" "$TESTSUITE_PKG"
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install package
        run: |
          pip install -e . --no-deps

      - name: Run backend tests with coverage
        run: |
          COVERAGE=1 bash tests/run_sharded_tests.sh
        env:
          PYTHONPATH: tests
          BIGQUERY_SCENARIOS_CONFIG_PATH: tests/config/bigquery_scenarios.yaml
          BIGQUERY_ACTIVE_SCENARIOS: bigquery_emulator
          # Fewer shards + fewer concurrent jobs keep emulator DDL fast: the
          # error_handling schema fixture rebuilds tables for every test.
          SHARDS: 2
          FILE_TIMEOUT: 1200
          TEST_TIMEOUT: 300
        timeout-minutes: 45

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests,python-3.12
          name: codecov-bigquery-3.12
          fail_ci_if_error: false



