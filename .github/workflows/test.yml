# .github/workflows/test.yml
name: Python Test

on:
  push:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  pull_request:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # rhosocial-activerecord and rhosocial-activerecord-testsuite dev releases are
  # not published to PyPI; install them from git.
  # This branch pins the core release and the testsuite feature branch that
  # carries the directory-owned-database architecture. Restore the testsuite
  # release-branch pin once that branch is merged.
  CORE_PKG: "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@feature/activerecord-ddl"
  TESTSUITE_PKG: "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-ddl"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install "$CORE_PKG" "$TESTSUITE_PKG"
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install package
        run: |
          pip install -e . --no-deps

      - name: Start BigQuery emulator
        run: |
          docker run -d --name bigquery-emulator -p 9050:9050 -p 9060:9060 \
            ghcr.io/goccy/bigquery-emulator:latest --project=test --dataset=test_dataset
          sleep 4
          docker ps

      - name: Run backend tests
        run: |
          pytest tests/ --tb=short -q -o asyncio_mode=auto
        env:
          PYTHONPATH: tests
          BIGQUERY_SCENARIOS_CONFIG_PATH: tests/config/bigquery_scenarios.yaml
          BIGQUERY_ACTIVE_SCENARIOS: bigquery_emulator
        timeout-minutes: 60

  # Coverage is collected on a single Python version to keep the emulator
  # cost bounded; the matrix above is the real compatibility gate.
  test-with-coverage:
    name: Python 3.12 with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install "$CORE_PKG" "$TESTSUITE_PKG"
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install package
        run: |
          pip install -e . --no-deps

      - name: Start BigQuery emulator
        run: |
          docker run -d --name bigquery-emulator -p 9050:9050 -p 9060:9060 \
            ghcr.io/goccy/bigquery-emulator:latest --project=test --dataset=test_dataset
          sleep 4
          docker ps

      - name: Run backend tests with coverage
        run: |
          coverage run --source=src -m pytest tests/ --tb=short -q -o asyncio_mode=auto
          coverage xml
          coverage report
        env:
          PYTHONPATH: tests
          BIGQUERY_SCENARIOS_CONFIG_PATH: tests/config/bigquery_scenarios.yaml
          BIGQUERY_ACTIVE_SCENARIOS: bigquery_emulator

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests,python-3.12
          name: codecov-bigquery-3.12
          fail_ci_if_error: false



